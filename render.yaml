# Render blueprint: the API and the diorama. The database is Supabase (see README, "Deploy your own").
# New > Blueprint, point it at the repository; Render asks for DATABASE_URL on first apply.
# The free tier sleeps when idle; the API resets the terminal on every boot, so a visit starts a fresh shift.
services:
  - type: web
    name: portdb-api
    runtime: docker
    region: frankfurt    # next to Supabase eu-west-2: every transaction is a round trip
    rootDir: backend
    plan: free
    healthCheckPath: /api/layout
    envVars:
      # Supabase > Connect > Session pooler (port 5432). Not the transaction pooler on 6543: the change
      # feed needs a LISTEN session and every transaction sets portdb.sim_t.
      - key: DATABASE_URL
        sync: false

  - type: web
    name: portdb
    runtime: docker
    region: frankfurt
    rootDir: frontend
    plan: free
    envVars:
      - key: PORT          # nginx listens on 80
        value: "80"
      - key: API_SCHEME
        value: https
      # the API's public host, e.g. portdb-api-xxxx.onrender.com (no https://). Free instances have no
      # private network, so the internal name a fromService reference gives cannot be resolved
      - key: API_HOST
        sync: false
